# Kinema training config.
#
#   kinema train -c configs/moving-mnist.yaml
#   kinema train -c configs/moving-mnist.yaml --set trainer.train_lr=3e-4
#   kinema train -c configs/moving-mnist.yaml --resume
#
# Every key below maps directly onto a constructor argument, so anything the classes
# accept can be set here. Sized for a 6GB laptop GPU; raise dim and image_size if you
# have more memory.

data:
  # a folder of clips: GIFs, MP4s, or subdirectories of numbered image frames
  folder: ./samples
  #
  # Sidecar captions are picked up automatically: put fireworks.txt next to fireworks.mp4
  # and set model.use_bert_text_cond below. trainer.captions: true makes a missing caption
  # an error; false ignores sidecars entirely.

model:
  dim: 64
  dim_mults: [1, 2, 4]
  attn_heads: 8
  attn_dim_head: 32
  use_sparse_linear_attn: true

diffusion:
  image_size: 32
  num_frames: 10
  timesteps: 1000
  # sample with DDIM by default: 50 network passes instead of 1000
  sampling_timesteps: 50
  ddim_sampling_eta: 0.0
  loss_type: l1

trainer:
  train_batch_size: 2
  train_lr: 1.0e-4
  train_num_steps: 100000
  gradient_accumulate_every: 2
  ema_decay: 0.995
  amp: false
  save_and_sample_every: 1000
  num_sample_rows: 2
  results_folder: ./results
  num_workers: 0
