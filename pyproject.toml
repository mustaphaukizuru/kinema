[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kinema"
dynamic = ["version"]
description = "Text-to-video diffusion in PyTorch — a space-time factored 3D U-Net you can actually train"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Mustapha Ukizuru", email = "hello@mustaphaukizuru.com" }]
maintainers = [{ name = "Mustapha Ukizuru", email = "hello@mustaphaukizuru.com" }]
keywords = [
    "artificial intelligence",
    "deep learning",
    "diffusion models",
    "text to video",
    "video generation",
    "pytorch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "einops>=0.6",
    "einops-exts>=0.0.4",
    "rotary-embedding-torch>=0.3",
    "torch>=2.0",
    "torchvision>=0.15",
    "pillow>=9",
    "tqdm>=4.60",
]

[project.optional-dependencies]
text = ["transformers>=4.30", "sentencepiece", "sacremoses"]
video = ["av>=10"]
cli = ["pyyaml>=6"]
dev = ["pytest>=7", "ruff>=0.4", "build>=1.0", "pyyaml>=6", "av>=10; python_version >= '3.10'"]

[project.scripts]
kinema = "kinema.cli:main"

[project.urls]
Homepage = "https://mustaphaukizuru.com"
Repository = "https://github.com/mustaphaukizuru/kinema"
Changelog = "https://github.com/mustaphaukizuru/kinema/blob/main/CHANGELOG.md"
Issues = "https://github.com/mustaphaukizuru/kinema/issues"
Paper = "https://arxiv.org/abs/2204.03458"

[tool.setuptools]
packages = ["kinema"]

[tool.setuptools.dynamic]
version = { attr = "kinema.version.__version__" }

[tool.ruff]
line-length = 140
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E251", "E203", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["error::DeprecationWarning:torch", "error::FutureWarning:torch", "error::ResourceWarning"]
